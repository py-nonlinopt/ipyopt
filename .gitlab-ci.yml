---
image: "${CI_REGISTRY_IMAGE}/manylinux2014_x86_64-ipopt:$CI_COMMIT_REF_SLUG"

build-image:
  stage: .pre
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - >
      /kaniko/executor \
        --context=.ci \
        --destination "$CI_REGISTRY_IMAGE/manylinux2014_x86_64-ipopt:$CI_COMMIT_REF_SLUG" \
        --cache=true \
        --cache-ttl=720h

build-sdist:
  image: python:slim
  stage: build
  needs: []
  script:
    - >
      [ -n "$CI_COMMIT_TAG" ] && sed -i -e "s/version=__version__,/version=\"${CI_COMMIT_TAG}\",/" setup.py
    - pip install numpy # Required in setup.py
    - python setup.py sdist
  artifacts:
    name: sdist
    paths:
      - dist/ipyopt-*.tar.gz

build-wheel:
  stage: build
  script:
    - >
      [ -n "$CI_COMMIT_TAG" ] && sed -i -e "s/version=__version__,/version=\"${CI_COMMIT_TAG}\",/" setup.py
    # Skip python 13 for now
    - >
      for py in /opt/python/cp3* ; do \
        case "$py" in *"cp313"* ) continue ;; esac ; \
        "$py"/bin/pip wheel . -w dist ; \
      done
    - >
      for wheel in dist/ipyopt-*.whl ; do \
        auditwheel repair "$wheel" -w dist ; \
      done
  artifacts:
    name: wheel
    paths:
      - dist/ipyopt-*manylinux*.whl

.install-wheel:
  before_script:
    - mkdir /tmp/ipyopt
    - pip install --no-index --find-links dist --target /tmp/ipyopt/ --no-deps ipyopt
    - pip install --no-index --find-links dist --no-deps ipyopt
    - mv /tmp/ipyopt/ipyopt.libs .
    - mv /tmp/ipyopt/ipyopt/ipyopt*.so ipyopt/

lint:
  stage: test
  image: python:slim
  needs: []
  script:
    - pip install ruff
    - ruff check ipyopt/ test/
    - ruff check --ignore T201 examples/
    - ruff format --check

mypy:
  stage: test
  image: python:slim
  needs: []
  before_script:
    - pip install mypy numpy
  script:
    - mypy .

test-examples:
  stage: test
  variables:
    py: /opt/python/cp312-cp312/bin
  before_script:
    - >
      "$py"/pip install scipy cython sympy .
    - >
      "$py"/cythonize -i examples/hs071_capsules.pyx
  script:
    - for script in examples/*.py ; do "$py"/python "$script" || exit 1 ; done

test:
  stage: test
  before_script:
    # Install built wheels:
    - >
      for py in /opt/python/cp3* ; do \
        case "$py" in *"cp313"* ) continue ;; esac ; \
        "$py"/bin/pip install numpy scipy \
        && "$py"/bin/pip install --only-binary ipyopt --no-index --find-links dist ipyopt ; \
      done
    # Delete ipopt folder to remove it from the PYTHON_PATH:
    - rm -rf ipyopt
  script:
    - >
      for py in /opt/python/cp3* ; do \
        case "$py" in *"cp313"* ) continue ;; esac ; \
        # Test without capsules:
        "$py"/bin/python -m unittest || exit 1 ; \
        "$py"/bin/python setup_test.py build_ext --inplace ; \
        # Test with capsules:
        "$py"/bin/python -m unittest || exit 1  ; \
      done

pypi:
  stage: deploy
  image: python:slim
  variables:
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
    - pip install twine
  script:
    - twine upload --repository-url $PYPI_REPOSITORY_URL dist/*
  rules:
    - if: $CI_COMMIT_TAG

create_gitlab_release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli
  needs:
    - job: pypi
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add git
  script:
    - TAG_MESSAGE="$(git tag --format='%(contents)' -l $CI_COMMIT_TAG)"
    - >
      release-cli create \
        --name "$CI_COMMIT_TAG" \
        --description "$TAG_MESSAGE" \
        --tag-name "$CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_TAG"

pages:
  stage: deploy
  image: python:slim
  extends: .install-wheel
  script:
    - pip install numpy scipy cython sympy sphinx sphinx_rtd_theme
    - sphinx-build -M html docs build
    - mv build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
